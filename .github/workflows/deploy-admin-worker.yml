
name: Deploy Admin Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-admin-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned Wrangler
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler"
          cd "$RUNNER_TEMP/wrangler"
          npm init -y
          npm install --no-audit --no-fund --save-exact wrangler@4.151.3

      - name: Verify Wrangler installation
        run: "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler --version"

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler deploy"
