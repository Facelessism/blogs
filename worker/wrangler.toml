name = "blogs-admin-api"
main = "src/index.js"
compatibility_date = "2026-10-23"

[vars]
ADMIN_GITHUB_USERNAME = "Facelessism"
ALLOWED_ORIGIN = "https://facelessism.github.io"
SESSION_TTL_SECONDS = "1800"
GITHUB_REPO_OWNER = "Facelessism"
GITHUB_REPO_NAME = "blogs"
GITHUB_BRANCH = "main"
BLOG_DIRECTORY = "src/content/blog"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
